# Pixal3D (MIT), Tencent ARC and Tsinghua University: TRELLIS.2 conditioned on image features
# lifted pixel by pixel into its voxel grid, from one image or several views of the subject.
# Fetched at install time, never committed here.
name: pixal3d
python: "3.11"
# No mps lane: TRELLIS.2's voxel, mesh and sparse convolution extensions are CUDA kernels.
lanes: [cuda]
# NATTEN (below) does not build on Windows, so a Windows computer is not offered the install
# and sends these models to a Linux one.
os: [linux]
# Upstream installs on top of TRELLIS.2's environment: torch 2.6.0 on CUDA 12.4.
torch_backend: { cuda: cu124 }
upstream:
  url: https://codeload.github.com/TencentARC/Pixal3D/tar.gz/f7cf38429b0bd264f1995f0f8743a88b1c728b94
  sha256: 0eeeb947f0657d56a6b96fe873049b226a6e46e6e2060d904c57ae4ea6f2a2ec
  license: MIT
  pythonpath: ["."]
  extra:
    # NAF, the feature upsampler of Pixal3D's image encoders, which upstream fetches through
    # torch.hub when it first runs.
    - name: naf
      url: https://codeload.github.com/valeoai/NAF/tar.gz/37f2dfc180f2de53d98bd601109c0da0dd6b0f43
      sha256: 2afa7c146823a4518b7885418f1aabf537b0d8492d07dd60a98bf34333b21e47
      license: Apache-2.0
      pythonpath: ["."]
# TRELLIS.2's extensions, as the trellis2 family builds them, then NAF's neighborhood
# attention, compiled for this machine's GPU; NATTEN does not build on Windows.
build:
  - nvdiffrast @ git+https://github.com/NVlabs/nvdiffrast.git@253ac4fcea7de5f396371124af597e6cc957bfae
  - cumesh @ git+https://github.com/JeffreyXiang/CuMesh.git@12289e1062f0603f2f0d0771b02e1395d247f26f
  - flex_gemm @ git+https://github.com/JeffreyXiang/FlexGEMM.git@6dd94a859c26ee8246888502eada3dd8ad85532e
  - --no-deps o_voxel @ git+https://github.com/microsoft/TRELLIS.2.git@75fbf0183001ed9876c8dbb35de6b68552ee08bd#subdirectory=o-voxel
  - natten==0.21.0
smoke: "import torch, o_voxel, cumesh, flex_gemm, natten, src.model.naf, pixal3d.pipelines.pixal3d_mv_image_to_3d"
