[project]
name = "forja-hunyuan3d2"
version = "0.2.0"
description = "Forja adapter for the hunyuan3d2 model family"
license = "Apache-2.0"
requires-python = ">=3.11"
# Dependencies live in requirements/<lane>.txt: they differ per torch lane.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forja_hunyuan3d2"]
