[project]
name = "forja-engine-sdk"
version = "0.1.0"
description = "Stage interfaces and conformance suite for Forja model adapters"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# The contract must install anywhere an adapter does, so it needs nothing beyond the
# standard library. `forja-sdk test` reads manifests with PyYAML when it is installed.
dependencies = []

[project.scripts]
forja-sdk = "forja_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forja_sdk"]
