id: skintokens
name: SkinTokens (TokenRig)
family: skintokens
adapter: forja_skintokens:SkinTokens
# 2: keeps the normals of the mesh it rigs, which its normal map was baked against.
adapter_version: "2"
tasks: [rig]
# UniRig's successor, with markedly better skin weights: picked first where it fits.
rank: 10
description: Predicts the skeleton and the skin weights of the character together; can also weight the standard humanoid skeleton.
# Upstream's checkpoints are 1.6 GB; the environment (torch 2.7, open3d) about 6.5 GB.
disk_gb: 8.1
license: { spdx: MIT, commercial: true, url: "https://github.com/VAST-AI-Research/SkinTokens/blob/273b691d35989d71cd17ff2895fdc735097b92d1/LICENSE" }
# Upstream's README: an NVIDIA GPU with at least 14 GB. Below that it runs on another provider.
vram_gb: 14
requirements:
  cuda: { status: supported, min_vram_gb: 14 }
  mps: { status: unsupported }
  cpu: { status: unsupported }
weights:
  hub: huggingface
  repo: VAST-AI/SkinTokens
  revision: 79736cad0fd84de384d5eede659b4ebd24effe33
  files:
    - { path: experiments/articulation_xl_quantization_256_token_4/grpo_1400.ckpt, sha256: f4e4706a11cfb520cdde65156a0358545e4fbf8f36237aca01ea5e79d5cb5692, bytes: 1131603979 }
    - { path: experiments/skin_vae_2_10_32768/last.ckpt, sha256: 4843f49e58afff88345806b94ca82e6cc9d8def6e7432e2853c677b154de0ed4, bytes: 487311745 }
params:
  skeleton: { type: string, default: predict, enum: [predict, template], description: "template: weight Forja's standard humanoid skeleton instead of predicting one" }
  humanoid: { type: boolean, default: true, description: Give a predicted humanoid's bones the standard names game engines retarget to }
  # Upstream's demo defaults.
  beams: { type: integer, default: 10, minimum: 1, maximum: 20 }
  top_k: { type: integer, default: 5, minimum: 1, maximum: 200 }
  top_p: { type: number, default: 0.95, minimum: 0.1, maximum: 1.0 }
  temperature: { type: number, default: 1.0, minimum: 0.1, maximum: 2.0 }
  repetition_penalty: { type: number, default: 2.0, minimum: 0.5, maximum: 3.0 }
  postprocess: { type: boolean, default: false, description: Clean the weights with upstream's voxel pass }
