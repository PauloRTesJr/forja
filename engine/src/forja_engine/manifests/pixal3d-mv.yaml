    - { path: ckpts/slat_flow_img2shape_dit_1_3B_512_bf16_mv.json }
    - { path: ckpts/slat_flow_img2shape_dit_1_3B_512_bf16_mv.safetensors, sha256: 043a0d7fc7ee81792fcb22f836c91f5aaf69f4fda15e25c38488db13dd7b77ec, bytes: 5546764048 }
    - { path: ckpts/slat_flow_img2shape_dit_1_3B_1024_bf16_mv.json }
