id: pixal3d-mv
name: Pixal3D multi-view
family: pixal3d
adapter: forja_pixal3d:Pixal3DMV
tasks: [shape]
# Below Pixal3D, which a job with the front alone gets; above Hunyuan3D-2mv for side views.
rank: 12
views: [front, left, back, right]
description: Builds the shape from the front and any side or back views, each lined up with the shape.
# Estimated: the weights, 18.8 GB; the environment is the one Pixal3D already uses.
disk_gb: 18.8
license:
  spdx: MIT
  commercial: true
  restrictions:
    - "its image encoder, Meta's DINOv3, is under the DINOv3 License: no military, weapons or other uses trade controls forbid"
  url: https://github.com/TencentARC/Pixal3D/blob/f7cf38429b0bd264f1995f0f8743a88b1c728b94/LICENSE
# Upstream's inference.py: about 18 GB with every model on the GPU, 10 to 12 GB in its low-VRAM
# mode (each model on the GPU for its own step only, at resolution 1024), which fit-first takes
# when the budget is smaller; 10 lets a 12 GB card, whose budget is about 11, try it. The
# VRAM manager replaces these with measured peaks.
vram_gb: 18
requirements:
  cuda: { status: supported, min_vram_gb: 10 }
  mps: { status: unsupported }
  cpu: { status: unsupported }
weights:
  hub: huggingface
  repo: TencentARC/Pixal3D
