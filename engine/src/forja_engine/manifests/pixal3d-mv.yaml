    # NAF's checkpoint, from its release (Apache-2.0).
    - { url: "https://github.com/valeoai/NAF/releases/download/model/naf_release.pth", sha256: c096c1ab2217a5c3ac136365f721685e2201379cb69d509cfb0261183847c98f, path: naf/naf_release.pth, bytes: 2664431 }
params:
  # Upstream's default; its low-VRAM mode uses 1024.
  resolution: { type: integer, default: 1536, enum: [1024, 1536] }
  steps: { type: integer, default: 12, minimum: 4, maximum: 50 }
  fov_degrees: { type: number, default: 11.5, minimum: 1, maximum: 90, description: The reference's field of view; widen it for a photo with strong perspective }
  max_faces: { type: integer, default: 1000000, minimum: 10000, maximum: 16777216, description: Simplify a denser result to this many triangles }
  yaw_degrees: { type: number, default: 0, description: Rotate the output about Y if it faces the wrong way }
