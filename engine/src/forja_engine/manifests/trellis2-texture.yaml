id: trellis2-texture
name: TRELLIS.2 Paint
family: trellis2
adapter: forja_trellis2:Trellis2Texture
tasks: [texture]
# Above Hunyuan3D-2 Paint: it paints roughness and metallic maps too. Needs 24 GB, so a 12 GB
# card keeps Hunyuan3D-2 Paint and sends this one to another computer.
rank: 20
description: Paints the low-poly mesh from the reference, with base color, roughness and metallic maps.
# Estimated: the weights, 8.0 GB; the environment is the one TRELLIS.2 already uses.
disk_gb: 8.0
license:
  spdx: MIT
  commercial: true
  restrictions:
    - "its image encoder, Meta's DINOv3, is under the DINOv3 License: no military, weapons or other uses trade controls forbid"
  url: https://github.com/microsoft/TRELLIS.2/blob/75fbf0183001ed9876c8dbb35de6b68552ee08bd/LICENSE
# Upstream's README: an NVIDIA GPU with at least 24 GB. The VRAM manager replaces it with measured peaks.
vram_gb: 24
requirements:
  cuda: { status: supported, min_vram_gb: 24 }
  mps: { status: unsupported }
  cpu: { status: unsupported }
