id: triposg
name: TripoSG
family: triposg
adapter: forja_triposg:TripoSG
tasks: [shape]
rank: 10
description: Turns the cut-out image into a detailed 3D shape.
# Measured on the reference Windows PC: environment 5.0 GB, weights 7.5 GB.
disk_gb: 12.5
license: { spdx: MIT, commercial: true, url: "https://github.com/VAST-AI-Research/TripoSG/blob/fc5c40990181e2a756c4e0b1c2f4d6b5202faf8c/LICENSE" }
vram_gb: 8
requirements:
  cuda: { status: supported, min_vram_gb: 8, dtypes: [fp16, bf16] }
  # Its mesh extraction needs diso's CUDA kernel (families/triposg/family.yaml).
  mps: { status: unsupported }
  cpu: { status: unsupported }
weights:
  hub: huggingface
  repo: VAST-AI/TripoSG
  revision: 2c1c516d22d58db486a058d98d31bb6177344e06
params:
  steps: { type: integer, default: 50, minimum: 8, maximum: 100 }
  guidance_scale: { type: number, default: 7.0, minimum: 1.0, maximum: 15.0 }
  octree_depth: { type: integer, default: 9, minimum: 7, maximum: 10 }
  yaw_degrees: { type: number, default: 0, description: Rotate the output about Y if it faces the wrong way }
