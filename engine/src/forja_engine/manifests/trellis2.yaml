id: trellis2
name: TRELLIS.2
family: trellis2
adapter: forja_trellis2:Trellis2Shape
tasks: [shape]
# Above TripoSG: sharper detail, open and non-manifold surfaces. Needs 24 GB, so a 12 GB card
# keeps TripoSG and sends this one to another computer.
rank: 15
description: Turns the cut-out image into a detailed shape, with open surfaces and thin parts.
# Estimated: environment about 6 GB (torch 2.6, compiled extensions), weights 10.1 GB.
disk_gb: 16.1
license:
  spdx: MIT
  commercial: true
  restrictions:
    - "its image encoder, Meta's DINOv3, is under the DINOv3 License: no military, weapons or other uses trade controls forbid"
  url: https://github.com/microsoft/TRELLIS.2/blob/75fbf0183001ed9876c8dbb35de6b68552ee08bd/LICENSE
# Upstream's README: an NVIDIA GPU with at least 24 GB. The VRAM manager replaces it with measured peaks.
vram_gb: 24
requirements:
  cuda: { status: supported, min_vram_gb: 24 }
  mps: { status: unsupported }
  cpu: { status: unsupported }
