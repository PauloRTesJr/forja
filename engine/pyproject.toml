[project]
name = "forja-engine"
version = "0.1.0"
description = "Forja inference engine: runs stage batches on local devices"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "numpy>=2.0",
    "pillow>=11.0",
    "trimesh>=4.5",
    "fast-simplification>=0.1.9",
    "xatlas>=0.0.9",
    "blake3>=1.0",
    "pyyaml>=6.0",
    "psutil>=6.0",
    "scipy>=1.14",
]

[project.scripts]
forja-engine = "forja_engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forja_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
