# git-cliff turns the Conventional Commits history into CHANGELOG.md (`make changelog`) and into
# each GitHub Release's notes (.github/workflows/release.yml).

[changelog]
header = """
# Changelog

Every change to Forja, newest first, generated from the commit history (`make changelog`).
App, core and engine share one version.\n
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"
# The comments order the sections; they are stripped from the headings.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^build", group = "<!-- 5 -->Build and packaging" },
  { message = "^ci", group = "<!-- 6 -->Continuous integration" },
  { message = "^test", group = "<!-- 7 -->Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|style|revert)", group = "<!-- 8 -->Other" },
]
