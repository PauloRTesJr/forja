name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through private reporting instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Dropped a 2048x2048 PNG on Generate with the Mobile prop preset
        2. The shape stage failed with "..."
        Expected: a textured GLB
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Desktop app
        - forja CLI
        - Both
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        In the app: Settings, then **Copy diagnostics**, and paste here. From a terminal: `forja diagnostics`.
        It holds versions, hardware, settings, models, providers and the end of the engine log. Your home folder is shown as `~` and no key or token is in it, but it does list the addresses of other computers you added; remove anything you would rather not share.
      render: text
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, the input image if you can share it, how often it happens.
