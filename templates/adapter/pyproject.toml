[project]
name = "forja-example"
version = "0.1.0"
description = "Forja model package: an example shape model that extrudes the subject's silhouette"
license = "Apache-2.0"
requires-python = ">=3.11"
# Dependencies live in requirements/<lane>.txt: they differ per torch lane.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forja_example"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
