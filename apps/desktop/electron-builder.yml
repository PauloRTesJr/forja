appId: dev.forja.desktop
productName: Forja
# No spaces, and the OS and architecture in every name, so all packages can sit in one GitHub
# Release next to SHA256SUMS.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**
extraResources:
  # The Go core ships next to the app; `make core` builds it.
  - from: ../../core/bin/
    to: bin/
    filter: ['forja', 'forja.exe']
mac:
  # Build with `pnpm dist:mac` after `make core-all`: scripts/dist-mac.mjs picks the signing.
  # The zip is what an updater installs on a Mac (spec section 9), so it ships beside the DMG.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.graphics-design
  icon: build/icon.icns
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  minimumSystemVersion: "13.0"
  # Notarization requires the hardened runtime. electron-builder signs with a Developer ID
  # certificate (CSC_LINK, or CSC_NAME for one in the keychain) and then notarizes when
  # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    # Both darwin binaries of make core-all: ${arch} says x64 where Go says amd64, so a filter
    # cannot pick one. The app starts the one for its architecture (src/main/binary.ts).
    - from: ../../core/bin/
      to: bin/
      filter: [forja-darwin-arm64, forja-darwin-amd64]
# Authenticode-signed only when WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD are set (release.yml);
# unsigned builds work but SmartScreen warns on first run.
win:
  target: [nsis, zip]
  icon: build/icon.ico
nsis:
  perMachine: false
  oneClick: true
  artifactName: ${productName}-${version}-${os}-${arch}-setup.${ext}
linux:
  target: [AppImage, deb]
  category: Graphics
  icon: build/icon.png
  synopsis: Turn a reference image into a game-ready 3D asset
  # .deb requires a maintainer; there is no package.json author to take it from.
  maintainer: Forja contributors
