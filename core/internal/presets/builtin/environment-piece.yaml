id: environment-piece
name: Environment piece
description: 15k triangles, 2K base color, two LODs.
stages:
  - { id: bg, use: background-removal, model: stub-background, inputs: [input:image] }
  - { id: frame, use: framing }
  - { id: shape, use: shape, model: stub-shape, params: { resolution: 128 } }
  - { id: cleanup, use: mesh.cleanup }
  - { id: lowpoly, use: mesh.decimate, params: { target_tris: 15000 } }
  - { id: uv, use: mesh.uv }
  - { id: paint, use: texture, model: stub-paint, params: { resolution: 2048 }, inputs: [uv, frame] }
  - { id: lods, use: mesh.lods, params: { ratios: [0.5, 0.25] } }
  - { id: export, use: export, params: { format: glb, compression: meshopt } }
