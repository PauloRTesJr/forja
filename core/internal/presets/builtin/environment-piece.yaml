id: environment-piece
name: Environment piece
description: 15k triangles, 2K base color with baked normal and AO maps, two LODs.
stages:
  - { id: bg, use: background-removal, inputs: [input:image] }
  - { id: frame, use: framing, params: { size: 1024 } }
  - { id: shape, use: shape }
  - { id: cleanup, use: mesh.cleanup }
  - id: remesh
    use: mesh.remesh
    inputs: [cleanup]
    params: { preserve_sharp: true }
    optional:
      label: Quad remesh with Blender
      help: >-
        Instead of simplifying the generated mesh, rebuilds it from evenly sized quads with
        Blender's QuadriFlow, within the same triangle budget, keeping sharp edges. Even
        topology is easier to edit. Needs Blender 4.2 or newer.
      default: false
      replaces: lowpoly
  - { id: lowpoly, use: mesh.decimate, inputs: [cleanup], params: { target_tris: 15000 } }
  # Painters unwrap UVs themselves unless this optional stage did.
  - id: uv
    use: mesh.uv.smart
    inputs: [lowpoly]
    optional:
      label: Unwrap with Blender's Smart UV Project
      help: >-
        Cuts the UVs at sharp angles into fewer, straighter islands than the painter's own
        unwrap, which suits hard-surface pieces and makes the texture easier to edit by hand.
        Needs Blender 4.2 or newer.
      default: false
  - { id: paint, use: texture, params: { resolution: 2048 }, inputs: [uv, frame] }
  - id: match
    use: texture.match
    inputs: [paint, frame, bg]
    optional:
      label: Match the reference colors
      help: >-
        Painting models can drift from the reference image's colors. This step pulls the
        painted texture back toward them, and projects the reference onto the parts of the
        asset it shows. When the job has back and side views, those are projected too.
      default: false
  - { id: bake, use: bake, inputs: [match, cleanup] }
  - { id: lods, use: mesh.lods, params: { ratios: [0.5, 0.25] } }
  - { id: export, use: export, params: { format: glb, compression: meshopt } }
