id: hero-character
name: Hero character
description: 30k triangles, 2K base color with baked normal and AO maps, two LODs, optionally rigged.
stages:
  - { id: bg, use: background-removal, inputs: [input:image] }
  - { id: frame, use: framing, params: { size: 1024 } }
  - { id: shape, use: shape }
  - { id: cleanup, use: mesh.cleanup }
  - { id: lowpoly, use: mesh.decimate, params: { target_tris: 30000 } }
  # Painters unwrap UVs themselves, so there is no separate UV stage.
  - { id: paint, use: texture, params: { resolution: 2048 }, inputs: [lowpoly, frame] }
  - id: match
    use: texture.match
    inputs: [paint, frame]
    optional:
      label: Match the reference colors
      help: >-
        Painting models can drift from the reference image's colors. This step pulls the
        painted texture back toward them, and projects the reference onto the parts of the
        asset it shows.
      default: false
  - { id: bake, use: bake, inputs: [match, cleanup] }
  # Rigs the mesh that ships, before the LODs, so every level carries the same skin.
  - id: rig
    use: rig
    inputs: [bake]
    optional:
      label: Rig the character
      help: >-
        Adds a skeleton and skin weights so the character can be posed and animated. A
        humanoid gets the standard bone names game engines retarget animations to.
      default: false
  - { id: lods, use: mesh.lods, params: { ratios: [0.5, 0.25] } }
  - { id: export, use: export, params: { format: glb, compression: meshopt } }
