id: draft
name: Draft
description: Fast untextured shape to judge the silhouette.
stages:
  - { id: bg, use: background-removal, model: stub-background, inputs: [input:image] }
  - { id: frame, use: framing }
  - { id: shape, use: shape, model: stub-shape, params: { resolution: 64 } }
  - { id: cleanup, use: mesh.cleanup }
  - { id: export, use: export, params: { format: glb } }
